<style>
  :root {
    --bg: #eef1f6;
    --paper: #ffffff;
    --ink: #1f2733;
    --muted: #5b6675;
    --faint: #8a94a4;
    --accent: #2f5dd0;
    --accent-soft: #eaf0fd;
    --sidebar: #f6f8fc;
    --line: #e4e8ef;
    --badge: #2f5dd0;
    --maxw: 920px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---- Top bar with language toggle ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    align-items: center;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 14px 20px 6px;
  }
  .lang-toggle {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    box-shadow: 0 2px 8px rgba(31,39,51,.06);
  }
  .lang-toggle button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .02em;
    padding: 7px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .lang-toggle button.active {
    background: var(--accent);
    color: #fff;
  }
  .print-btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(31,39,51,.06);
    transition: color .18s ease, border-color .18s ease;
  }
  .print-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- Paper ---- */
  .paper {
    max-width: var(--maxw);
    margin: 6px auto 48px;
    background: var(--paper);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(31,39,51,.10);
  }

  /* ---- Header ---- */
  header.cv-head {
    padding: 38px 44px 30px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .name {
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -.02em;
    line-height: 1.05;
    margin: 0;
  }
  .role {
    margin: 8px 0 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: .01em;
  }
  .portfolio-link {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--faint);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
    transition: color .18s ease, border-color .18s ease;
  }
  .portfolio-link:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- Body grid ---- */
  .grid {
    display: grid;
    grid-template-columns: 270px 1fr;
  }
  aside {
    background: var(--sidebar);
    padding: 32px 28px;
    border-right: 1px solid var(--line);
  }
  main { padding: 32px 36px; }

  .section { margin-bottom: 26px; }
  .section:last-child { margin-bottom: 0; }
  .section h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 12px;
    padding-bottom: 7px;
    border-bottom: 2px solid var(--accent-soft);
  }

  .about { font-size: 14px; color: var(--muted); margin: 0; }

  .contact-list, .plain-list { list-style: none; margin: 0; padding: 0; }
  .contact-list li {
    display: flex;
    gap: 9px;
    align-items: flex-start;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 9px;
    word-break: break-word;
  }
  .contact-list li svg { flex: 0 0 16px; margin-top: 2px; color: var(--accent); }
  .contact-list a { color: var(--muted); text-decoration: none; }
  .contact-list a:hover { color: var(--accent); text-decoration: underline; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 12.5px;
    font-weight: 500;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 5px 11px;
    border-radius: 7px;
  }

  .plain-list li {
    position: relative;
    padding-left: 16px;
    font-size: 13.5px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .plain-list li::before {
    content: "";
    position: absolute;
    left: 0; top: 8px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .lang-rows { display: flex; flex-direction: column; gap: 10px; }
  .lang-row { font-size: 13.5px; color: var(--muted); }
  .lang-row .lname { font-weight: 600; color: var(--ink); }

  /* ---- Timeline entries ---- */
  .entry { position: relative; padding-left: 22px; margin-bottom: 20px; }
  .entry:last-child { margin-bottom: 0; }
  .entry::before {
    content: "";
    position: absolute;
    left: 0; top: 6px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--accent);
  }
  .entry::after {
    content: "";
    position: absolute;
    left: 5px; top: 20px;
    bottom: -16px;
    width: 2px;
    background: var(--accent-soft);
  }
  .entry:last-child::after { display: none; }
  .entry .when {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .entry .what { font-size: 15px; font-weight: 700; margin: 3px 0 2px; }
  .entry .org { font-size: 13.5px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
  .entry .desc { font-size: 13px; color: var(--muted); margin: 0; }

  /* ---- Footer ---- */
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--faint);
    margin: -28px auto 40px;
    max-width: var(--maxw);
  }

  /* fade on language switch */
  .swap { transition: opacity .2s ease; }
  .swap.fading { opacity: 0; }

  /* ---- Responsive ---- */
  @media (max-width: 720px) {
    .grid { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    header.cv-head { padding: 28px 24px 22px; }
    main { padding: 26px 24px; }
    .name { font-size: 30px; }
    .paper { border-radius: 12px; margin: 6px 12px 40px; }
    .topbar { padding: 12px 16px 4px; }
  }

  /* ---- Print ---- */
  @media print {
    :root { --bg: #fff; }
    body { background: #fff; }
    .topbar, .foot { display: none !important; }
    .paper { box-shadow: none; margin: 0; border-radius: 0; max-width: 100%; }
    .grid { grid-template-columns: 250px 1fr; }
    aside { background: #f6f8fc !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chip, .entry::before, .section h2, .entry .when, .role { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { margin: 12mm; }
  }
</style>

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function renderEntries(containerId, items) {
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  items.forEach(it => {
    const e = el("div", "entry");
    e.appendChild(el("div", "when", it.when));
    e.appendChild(el("div", "what", it.what));
    if (it.org) e.appendChild(el("p", "org", it.org));
    if (it.desc) e.appendChild(el("p", "desc", it.desc));
    c.appendChild(e);
  });
}

function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;

  // simple text fields
  document.getElementById("f-name").textContent = d.name;
  document.getElementById("f-role").textContent = d.role;
  document.getElementById("f-portfolio").textContent = d.portfolio;
  document.getElementById("f-about").textContent = d.about;
  document.getElementById("f-foot").textContent = d.foot;
  document.getElementById("printBtn").textContent = d.print;

  // section titles via data-k
  document.querySelectorAll("[data-k]").forEach(node => {
    node.textContent = d[node.getAttribute("data-k")];
  });

  // contact
  const cl = document.getElementById("f-contact");
  cl.innerHTML = "";
  d.contact.forEach(item => {
    const li = el("li");
    li.innerHTML = ICONS[item.icon] || "";
    if (item.href) {
      const a = el("a");
      a.href = item.href;
      a.textContent = item.text;
      if (item.href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
      li.appendChild(a);
    } else {
      li.appendChild(el("span", null, item.text));
    }
    cl.appendChild(li);
  });

  // languages
  const lg = document.getElementById("f-langs");
  lg.innerHTML = "";
  d.langs.forEach(l => {
    const row = el("div", "lang-row");
    row.innerHTML = '<span class="lname">' + l.name + '</span>';
    lg.appendChild(row);
  });

  // skills
  const sk = document.getElementById("f-skills");
  sk.innerHTML = "";
  d.skills.forEach(s => sk.appendChild(el("span", "chip", s)));

  // honors
  const hn = document.getElementById("f-honors");
  hn.innerHTML = "";
  d.honors.forEach(h => hn.appendChild(el("li", null, h)));

  // education + projects
  renderEntries("f-edu", d.edu);
  renderEntries("f-proj", d.proj);

  // toggle active state
  document.querySelectorAll(".lang-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

function setLang(lang) {
  try { localStorage.setItem("cvLang", lang); } catch (e) {}
  const swaps = document.querySelectorAll(".swap");
  swaps.forEach(s => s.classList.add("fading"));
  setTimeout(() => {
    render(lang);
    swaps.forEach(s => s.classList.remove("fading"));
  }, 120);
}

// init
(function () {
  let start = "mn"; // Mongolian is the default
  try {
    const saved = localStorage.getItem("cvLang");
    if (saved === "en" || saved === "mn") start = saved; // honor a visitor's prior choice
  } catch (e) {}
  render(start);

  document.querySelectorAll(".lang-toggle button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());
})();
</script>
</body>
</html>
