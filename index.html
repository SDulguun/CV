<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Дөлгөөн Сүхчулуун — CV</title>
<meta name="description" content="Dulguun Sukhchuluun — Data Analyst / Data Scientist. Bilingual CV (Mongolian / English)." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e7eaee;
    --paper: #ffffff;
    --ink: #1c2530;          /* near-black slate for body text */
    --muted: #4c5663;        /* secondary text */
    --faint: #8a93a0;        /* captions / meta */
    --navy: #1e3a5f;         /* primary corporate accent */
    --navy-deep: #14283f;    /* header band */
    --navy-soft: #e9eef4;    /* tinted fills / underlines */
    --sidebar: #f4f6f9;
    --line: #e1e6ec;
    --line-soft: #eef1f5;
    --maxw: 940px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .serif { font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif; }

  /* ---- Top bar with language toggle ---- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    align-items: center;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 14px 20px 8px;
  }
  .lang-toggle {
    display: inline-flex;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 3px;
    box-shadow: 0 1px 4px rgba(20,40,63,.08);
  }
  .lang-toggle button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: .02em;
    padding: 7px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .lang-toggle button.active { background: var(--navy); color: #fff; }
  .print-btn {
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--muted);
    font: inherit;
    font-weight: 600;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(20,40,63,.08);
    transition: color .18s ease, border-color .18s ease;
  }
  .print-btn:hover { color: var(--navy); border-color: var(--navy); }

  /* ---- Paper ---- */
  .paper {
    max-width: var(--maxw);
    margin: 4px auto 48px;
    background: var(--paper);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 10px 34px rgba(20,40,63,.12);
    border-top: 4px solid var(--navy);   /* letterhead accent */
  }

  /* ---- Header ---- */
  header.cv-head {
    padding: 50px 48px 42px;
    border-bottom: 2px solid var(--navy-soft);
    display: flex;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
  }
  .avatar {
    width: 156px;
    height: 197px;             /* portrait frame matching the photo (253:320) */
    border-radius: 14px;
    object-fit: cover;          /* aspect matches the photo, so nothing is cropped */
    object-position: center;
    border: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(20,40,63,.16);
    flex: 0 0 auto;
    background: var(--sidebar);
  }
  .head-text { flex: 1 1 auto; min-width: 180px; }
  .name {
    font-size: 38px;
    font-weight: 600;
    color: var(--navy-deep);
    letter-spacing: -.01em;
    line-height: 1.05;
    margin: 0;
  }
  .role {
    margin: 9px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .portfolio-link {
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--navy);
    text-decoration: none;
    border: 1.5px solid var(--navy);
    padding: 9px 16px;
    border-radius: 6px;
    white-space: nowrap;
    transition: background .18s ease, color .18s ease;
  }
  .portfolio-link:hover { background: var(--navy); color: #fff; }

  /* ---- Body grid ---- */
  .grid { display: grid; grid-template-columns: 280px 1fr; }
  aside {
    background: var(--sidebar);
    padding: 34px 30px;
    border-right: 1px solid var(--line);
  }
  main { padding: 34px 40px; }

  .section { margin-bottom: 28px; }
  .section:last-child { margin-bottom: 0; }
  .section h2 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    color: var(--navy);
    margin: 0 0 13px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--navy-soft);
  }
  main .section h2 { font-size: 13px; }

  .about { font-size: 13.5px; color: var(--muted); margin: 0; line-height: 1.6; }

  /* ---- Contact ---- */
  .contact-list { list-style: none; margin: 0; padding: 0; }
  .contact-list li {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 11px;
    word-break: break-word;
  }
  .contact-list li:last-child { margin-bottom: 0; }
  .contact-list li svg { flex: 0 0 16px; margin-top: 2px; color: var(--navy); }
  .contact-list a { color: var(--muted); text-decoration: none; }
  .contact-list a:hover { color: var(--navy); text-decoration: underline; }

  /* ---- Skills ---- */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    font-size: 12.5px;
    font-weight: 500;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 5px 11px;
    border-radius: 5px;
  }

  /* ---- Languages ---- */
  .lang-rows { display: flex; flex-direction: column; gap: 15px; }
  .lang-row { font-size: 13.5px; }
  .lang-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 6px;
  }
  .lang-top .lname { font-weight: 500; color: var(--ink); }
  .lang-top .llevel { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .lang-meter { display: flex; gap: 4px; }
  .lang-meter i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
  .lang-meter i.on { background: var(--navy); }

  /* ---- Timeline entries (Education / Projects) ---- */
  .entry { position: relative; padding-left: 24px; margin-bottom: 22px; }
  .entry:last-child { margin-bottom: 0; }
  .entry::before {
    content: "";
    position: absolute;
    left: 0; top: 5px;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid var(--navy);
  }
  .entry::after {
    content: "";
    position: absolute;
    left: 5px; top: 19px;
    bottom: -18px;
    width: 2px;
    background: var(--line);
  }
  .entry:last-child::after { display: none; }
  .entry .when {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    color: var(--navy);
    text-transform: uppercase;
  }
  .entry .what { font-size: 15px; font-weight: 500; color: var(--ink); margin: 4px 0 2px; }
  .entry .org { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 0 5px; }
  .entry .desc { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.6; }

  /* ---- Honors & Awards (now in main column) ---- */
  .award-list { list-style: none; margin: 0; padding: 0; }
  .award-list li {
    position: relative;
    padding: 13px 0 13px 26px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.55;
    border-bottom: 1px solid var(--line-soft);
  }
  .award-list li:last-child { border-bottom: 0; padding-bottom: 0; }
  .award-list li::before {
    content: "";
    position: absolute;
    left: 2px; top: 17px;
    width: 8px; height: 8px;
    background: var(--navy);
    transform: rotate(45deg);
  }
  .award-list b { color: var(--ink); font-weight: 500; }

  /* ---- Footer ---- */
  .foot {
    text-align: center;
    font-size: 12px;
    color: var(--faint);
    margin: -28px auto 40px;
    max-width: var(--maxw);
  }

  .swap { transition: opacity .2s ease; }
  .swap.fading { opacity: 0; }

  /* ---- Responsive ---- */
  @media (max-width: 740px) {
    .grid { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    header.cv-head { padding: 26px 22px 20px; }
    main { padding: 26px 22px; }
    aside { padding: 28px 22px; }
    .name { font-size: 30px; }
    .paper { border-radius: 8px; margin: 4px 12px 40px; }
    .topbar { padding: 12px 16px 4px; }
  }

  /* ---- Print ---- */
  @media print {
    :root { --bg: #fff; }
    body { background: #fff; }
    .topbar, .foot { display: none !important; }
    .paper { box-shadow: none; margin: 0; border-radius: 0; max-width: 100%; border-top: 4px solid var(--navy); }
    .grid { grid-template-columns: 250px 1fr; }
    aside { background: #f4f6f9 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .chip, .entry::before, .section h2, .entry .when, .award-list li::before, .lang-row::before, .role {
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    @page { margin: 12mm; }
  }
</style>
</head>

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function renderEntries(containerId, items) {
  const c = document.getElementById(containerId);
  c.innerHTML = "";
  items.forEach(it => {
    const e = el("div", "entry");
    e.appendChild(el("div", "when", it.when));
    e.appendChild(el("div", "what", it.what));
    if (it.org) e.appendChild(el("p", "org", it.org));
    if (it.desc) e.appendChild(el("p", "desc", it.desc));
    c.appendChild(e);
  });
}

function render(lang) {
  const d = DATA[lang];
  document.documentElement.lang = d.htmlLang;
  document.title = d.title;

  document.getElementById("f-name").textContent = d.name;
  document.getElementById("f-role").textContent = d.role;
  document.getElementById("f-portfolio").textContent = d.portfolio;
  document.getElementById("f-about").textContent = d.about;
  document.getElementById("f-foot").textContent = d.foot;
  document.getElementById("printBtn").textContent = d.print;

  document.querySelectorAll("[data-k]").forEach(node => {
    node.textContent = d[node.getAttribute("data-k")];
  });

  // contact
  const cl = document.getElementById("f-contact");
  cl.innerHTML = "";
  d.contact.forEach(item => {
    const li = el("li");
    li.innerHTML = ICONS[item.icon] || "";
    if (item.href) {
      const a = el("a");
      a.href = item.href;
      a.textContent = item.text;
      if (item.href.startsWith("http")) { a.target = "_blank"; a.rel = "noopener"; }
      li.appendChild(a);
    } else {
      li.appendChild(el("span", null, item.text));
    }
    cl.appendChild(li);
  });

  // skills
  const sk = document.getElementById("f-skills");
  sk.innerHTML = "";
  d.skills.forEach(s => sk.appendChild(el("span", "chip", s)));

  // languages (name + level label + 5-segment proficiency meter)
  const lg = document.getElementById("f-langs");
  lg.innerHTML = "";
  d.langs.forEach(l => {
    const row = el("div", "lang-row");
    const top = el("div", "lang-top");
    top.innerHTML = '<span class="lname"></span><span class="llevel"></span>';
    top.querySelector(".lname").textContent = l.name;
    top.querySelector(".llevel").textContent = l.level;
    row.appendChild(top);
    const meter = el("div", "lang-meter");
    for (let i = 1; i <= 5; i++) meter.appendChild(el("i", i <= l.score ? "on" : null));
    row.appendChild(meter);
    lg.appendChild(row);
  });

  // honors
  const hn = document.getElementById("f-honors");
  hn.innerHTML = "";
  d.honors.forEach(h => hn.appendChild(el("li", null, h)));

  // education + projects
  renderEntries("f-edu", d.edu);
  renderEntries("f-proj", d.proj);

  document.querySelectorAll(".lang-toggle button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

function setLang(lang) {
  try { localStorage.setItem("cvLang", lang); } catch (e) {}
  const swaps = document.querySelectorAll(".swap");
  swaps.forEach(s => s.classList.add("fading"));
  setTimeout(() => {
    render(lang);
    swaps.forEach(s => s.classList.remove("fading"));
  }, 120);
}

(function () {
  let start = "mn"; // Mongolian is the default
  try {
    const saved = localStorage.getItem("cvLang");
    if (saved === "en" || saved === "mn") start = saved; // honor a visitor's prior choice
  } catch (e) {}
  render(start);

  document.querySelectorAll(".lang-toggle button").forEach(b => {
    b.addEventListener("click", () => setLang(b.dataset.lang));
  });
  document.getElementById("printBtn").addEventListener("click", () => window.print());
})();
</script>
